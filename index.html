<head>

<title>Intch · Growth Funnel v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:linear-gradient(170deg, hsl(244,100%,98%) 0%, hsl(230,25%,97%) 55%, hsl(0,0%,100%) 100%);
    --bg2:hsl(0,0%,100%); --card:hsl(230,25%,96%); --card2:hsl(0,0%,100%);
    --ink:hsl(230,35%,12%); --muted:hsl(230,10%,45%);
    --accent:hsl(244,75%,60%); --accent2:hsl(258,80%,65%); --good:hsl(152,68%,42%);
    --soft:hsl(244,100%,97%); --grad:linear-gradient(135deg, hsl(244,75%,60%) 0%, hsl(258,80%,65%) 100%);
    --line:hsl(230,20%,90%); --shadow:0 20px 50px -20px hsl(244 75% 60% / .28), 0 10px 30px -15px hsl(230 35% 12% / .12);
  }
  *{box-sizing:border-box}
  html{margin:0;background:hsl(230,25%,97%)}
  body{margin:0;
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);background:var(--bg);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:560px}
  .frame{background:var(--bg2);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:background .4s ease}
  .frame.hero{background:var(--bg2);border-color:var(--line)}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;letter-spacing:.3px;font-size:15px;color:var(--ink)}
  .logo span{color:var(--accent)}
  .prog{flex:1;height:6px;background:hsl(230,20%,92%);border-radius:99px;overflow:hidden}
  .logo svg{height:22px;width:auto;display:block}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pct{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
  .stage{padding:32px 26px 26px}
  .kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .kicker.soft{color:var(--muted)}
  h1{font-size:30px;line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
  h2{font-size:25px;line-height:1.15;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  h2.center,h1.center{text-align:center}
  p.sub{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
  p.sub.center{text-align:center}
  .opts{display:flex;flex-direction:column;gap:11px;margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:13px;padding:17px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card2);cursor:pointer;transition:.16s;font-size:15px;line-height:1.35;font-weight:500}
  .opt:hover{border-color:hsl(244 75% 60% / .5);background:var(--soft)}
  .opt.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
  .opt .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;color:transparent}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt .emoji{font-size:20px}
  .scale{display:flex;gap:12px;margin:6px 0 4px}
  .scard{flex:1;padding:26px 0;border:1px solid var(--line);border-radius:18px;background:var(--card2);cursor:pointer;font-size:32px;text-align:center;transition:.16s}
  .scard:hover{border-color:hsl(244 75% 60% / .5);background:var(--soft)}
  .scard.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
  .bubble{background:var(--soft);border:1px solid hsl(244 75% 60% / .3);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;margin-top:14px;color:hsl(244 50% 40%)}
  input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:15px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  input::placeholder{color:var(--muted)}
  .btn{margin-top:20px;width:100%;padding:17px;border:none;border-radius:999px;cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.01em;background:var(--grad);color:#fff;transition:.15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 16px 34px -12px hsl(244 75% 60% / .5)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:saturate(.6)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:hsl(244 75% 60% / .06);box-shadow:none}
  .center-emoji{font-size:60px;text-align:center;margin:10px 0 18px}
  .badge{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--muted);margin-bottom:18px}
  .proof{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;text-align:center}
  .proof .q{font-size:16px;line-height:1.5;margin:6px 0 14px}
  .stars{display:flex;justify-content:center;gap:26px;margin-top:10px;color:var(--muted);font-size:12px}
  .stars b{display:block;color:var(--ink);font-size:20px;margin-top:2px}
  .loader{display:grid;place-items:center;padding:14px 0 6px}
  .ring{width:60px;height:60px;border-radius:99px;border:5px solid rgba(24,22,60,.1);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .checks{margin:20px 0 4px;display:flex;flex-direction:column;gap:12px}
  .crow{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--muted);transition:.3s}
  .crow.done{color:var(--good)}
  .crow.active{color:var(--ink)}
  .cbox{width:22px;height:22px;border-radius:99px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:12px}
  .crow.done .cbox{background:var(--good);border-color:var(--good);color:#fff}
  .rev-num{display:inline-block;background:var(--good);color:#fff;font-weight:800;padding:2px 12px;border-radius:10px}
  .card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .card2 h4{margin:0 0 8px;font-size:15px}
  .card2 p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  .mile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;font-size:14px}
  .mile .ic{font-size:20px}
  /* growth chart hero */
  .growchart{margin:14px 0 8px}
  .growchart svg{width:100%;height:auto;display:block}
  .grow-line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.2s cubic-bezier(.4,0,.2,1) forwards .15s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .grow-dot{opacity:0;animation:pop .3s ease forwards}
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  /* timeline (personal plan) — carded */
  .timeline{margin:14px 0 6px;position:relative}
  .tl-row{position:relative;display:flex;gap:14px;padding:0 0 12px 0}
  .tl-row:last-child{padding-bottom:0}
  .tl-row::before{content:"";position:absolute;left:9px;top:28px;bottom:-4px;width:2px;background:rgba(24,22,60,.14)}
  .tl-row:last-child::before{display:none}
  .tl-dot{width:20px;height:20px;border-radius:99px;border:2px solid var(--accent);background:#fff;flex:none;margin-top:15px;z-index:1}
  .tl-row.start .tl-dot{border-color:var(--muted)}
  .tl-row.goal .tl-dot{background:var(--good);border-color:var(--good);box-shadow:0 0 0 5px rgba(18,184,134,.18)}
  .tl-body{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
  .tl-row.goal .tl-body{border-color:rgba(18,184,134,.4);background:rgba(18,184,134,.08);box-shadow:0 0 26px rgba(18,184,134,.12)}
  .tl-when{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .tl-row.goal .tl-when{color:var(--good)}
  .tl-what{font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .tl-row.goal .tl-what{color:var(--good)}
  /* pipeline (how Intch works) */
  .pipe{margin:20px 0 6px}
  .pl-row{position:relative;display:flex;gap:16px;padding:0 0 24px 0}
  .pl-row:last-child{padding-bottom:0}
  .pl-row::before{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:rgba(24,22,60,.14)}
  .pl-row:last-child::before{display:none}
  .pl-dot{width:32px;height:32px;border-radius:99px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);z-index:1}
  .pl-row.done .pl-dot{background:var(--good);border-color:var(--good);color:#fff}
  .pl-row.next .pl-dot{border-color:var(--accent);color:var(--accent)}
  .pl-t{font-size:16px;font-weight:700}
  .pl-row.next .pl-t{color:var(--accent)}
  .pl-s{font-size:13px;color:var(--muted);margin-top:2px}
  /* booking screen (wow) */
  .expo{position:relative;display:grid;place-items:center;padding:16px 0 2px}
  .expo-glow{position:absolute;width:200px;height:130px;background:radial-gradient(circle,rgba(108,92,231,.3),transparent 68%);filter:blur(6px)}
  .avstack{position:relative;display:flex;justify-content:center}
  .avc{width:60px;height:60px;border-radius:99px;border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;margin-left:-16px;box-shadow:0 6px 18px rgba(24,22,60,.16);animation:pop .4s ease backwards}
  .avc:nth-child(1){margin-left:0;animation-delay:.05s}.avc:nth-child(2){animation-delay:.15s}.avc:nth-child(3){animation-delay:.25s}.avc:nth-child(4){animation-delay:.35s}
  .avc.more{background:var(--card);color:var(--muted);font-size:22px}
  .matched-badge{display:inline-flex;gap:6px;align-items:center;background:rgba(18,184,134,.12);border:1px solid rgba(18,184,134,.35);color:var(--good);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;margin-top:8px}
  .pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600}
  .leftcard{text-align:left;margin-top:14px}
  .clist{display:flex;flex-direction:column;gap:11px}
  .ci{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.45}
  .ck{width:20px;height:20px;border-radius:99px;background:rgba(18,184,134,.15);color:var(--good);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
  .btn.glow{animation:btnglow 2.4s ease-in-out infinite}
  @keyframes btnglow{0%,100%{box-shadow:0 0 0 rgba(108,92,231,0)}50%{box-shadow:0 0 30px rgba(108,92,231,.4)}}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .backlink{color:var(--ink);cursor:pointer;font-size:22px;line-height:1;user-select:none;opacity:.6;padding-right:2px}
  .backlink:hover{opacity:1}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .foot a{color:var(--accent);text-decoration:none}
  .err{color:#E11D48;font-size:13px;text-align:center;margin-top:10px}
  /* mirror reveal (Variant A) */
  .mirror-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px}
  .mirror-card h2{font-size:24px;letter-spacing:-.02em}
  .mirror-h{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0 0 16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600}
  .mirror-mid{text-align:center;color:var(--accent);font-size:12px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;margin:16px 0}
  .reqrow{margin:15px 0}
  .reqrow:first-of-type{margin-top:0}
  .reqhead{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:7px;color:var(--muted)}
  .reqtrack{height:10px;background:rgba(24,22,60,.08);border-radius:99px;overflow:hidden}
  .reqtrack>i{display:block;height:100%;background:rgba(24,22,60,.18);border-radius:99px}
  .reqrow.mine .reqhead,.reqrow.mine .reqhead b{color:var(--ink)}
  .reqrow.mine .reqtrack>i{background:linear-gradient(90deg,var(--accent),var(--good))}
  .devnote{max-width:560px;margin:14px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.5}
  svg{display:block;width:100%}
</style>

<script>
const A={};
let step=0;

// ---------- content maps ----------
const GOAL_AFF={
  sales:"Great goal. Owners who hit this usually don't need more hustle — they need the right system and the right people. Let's pinpoint yours.",
  marketing:"Smart focus. A steady flow of leads isn't luck — it's a system and the right person running it. Let's find yours.",
  pipeline:"That's the goal — revenue you can count on every month. It's a system, not luck. Let's map it.",

  const opts=scr.choices.map(c=>{

}

function choose(el,key,v){
  A[key]=v;

function chooseMulti(el,key,v){

const LEAD_SOURCE = 'b2b_quiz_growth_audit';                  // register-lead lead_source (ENUM) — заведён бэкендом (MR !976)
// ONBOARDING_AD_TYPE (числовой onboarding_type для register-lead) не используется — S2S Lead выключен, только браузерный fbq Lead с дедуп-eventID
// На intch.org — строгий прод-режим (email-экран не пропускается без 200 OK).
// На Vercel / localhost — мягкий пропуск, чтобы драфт оставался кликабельным для команды.
const DEV_BYPASS = (location.hostname.indexOf('intch.org') === -1);

const LEAD = { uid:null, country_code:null };
const FB_LEAD_EVENT_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : genUUID();
let leadRegistered = false;

function genUUID(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}

async function registerLead(){
  if(leadRegistered) return; leadRegistered=true;
  try{
    // onboarding_type (числовой) НЕ передаём: серверного S2S Lead нет (по решению бэка), route для A/B делает строковый onboarding_type в save-data
    const u=API_BASE+'/service/register-lead/?locale='+encodeURIComponent(LOCALE)+'&lead_source='+encodeURIComponent(LEAD_SOURCE);
    const res=await fetch(u); if(!res.ok) return; const j=await res.json();
    LEAD.uid=j.uid||null; LEAD.country_code=j.country_code||null;
    console.log('register-lead ok', LEAD);
  }catch(e){ console.warn('register-lead failed', e); }
}

function getUTM(){
  const utm={};
  try{ new URL(window.location.href).searchParams.forEach(function(v,k){ if(k.indexOf('utm_')===0) utm[k]=v; }); }catch(e){}
  if(Object.keys(utm).length) return utm;
  const m=document.cookie.match(/(?:^|;\s*)first_utm=([^;]+)/);
  if(m){ try{ return JSON.parse(decodeURIComponent(m[1])); }catch(e){} }
  return null;
}

// answer → [field, value-enum map]. Единый модуль — список энумов согласовать и прислать бэкенду.
// Номера экранов (s{N}) — по спеке воронки, экраны без выбора пропускаем.
const ANSWER_MAP={
  goal:      ['s1_goal',        {sales:'more_sales',marketing:'more_leads',markets:'new_markets',other:'other'}],
  niche:     ['s2_niche',       {saas:'saas',agency:'agency',ecom:'ecommerce',prod:'manufacturing',edu:'education',other:'other'}],
  revenue:   ['s3_revenue',     {lt10:'under_10k','10-50':'10_50k','50-150':'50_150k','150+':'150k_plus'}],
  bottleneck:['s4_growth_point',{leads:'find_leads',close:'close_deals',brand:'brand_awareness',scale:'scaling'}],
  role:      ['s7_role',        {founder:'founder',clevel:'c_level',head:'head',employee:'employee'}],
  team:      ['s8_team_size',   {'1-5':'1_5','6-20':'6_20','21-50':'21_50','51-150':'51_150','150+':'150_plus'}],
  urgency:   ['s9_urgency',     {now:'now',quarter:'this_quarter',year:'this_year',explore:'exploring'}],
  vision:    ['s10_target',     {g1030:'10_30',g3050:'30_50',g50100:'50_100',g100:'100_plus'}]
};
const FOCUS_MAP={revenue:'predictable_revenue',cycle:'shorter_cycle',close:'higher_close_rate',margins:'stronger_margins',inbound:'inbound_leads',selfrun:'team_sells'};

function mapAnswers(){
  const out={};
  for(const k in ANSWER_MAP){ const f=ANSWER_MAP[k][0], vm=ANSWER_MAP[k][1], v=A[k]; if(v!=null && vm[v]!=null) out[f]=vm[v]; }
  return out;
}

function buildPayload(){
  const d={};
  d.email=(A.email||'').trim().toLowerCase();
  d.locale=LOCALE;
  d.category_type=CATEGORY_TYPE;
  d.onboarding_type=ONBOARDING_PATH;
  d.accepted_terms=true;
  if(LEAD.country_code) d.country_code=LEAD.country_code;
  if(FB_LEAD_EVENT_ID) d.fb_lead_event_id=FB_LEAD_EVENT_ID;
  const utm=getUTM(); if(utm) d.first_utm=utm;
  Object.assign(d, mapAnswers());
  return d;
}

async function saveData(payload){
  const res=await fetch(API_BASE+'/api/v2/settings/setup/new-onboarding/save-data/',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:payload})
  });
  if(res.ok) return res.json();
  if(res.status===400) throw await res.json();   // { error_code, error_message }
  throw new Error('API '+res.status);
}

function fireQuizLead(externalId){
  // Lead с дедупликацией: тот же eventID уходит в save-data как fb_lead_event_id
  try{ if(typeof fbq==='function') fbq('track','Lead',{ external_id: externalId||undefined },{ eventID: FB_LEAD_EVENT_ID }); }catch(e){}
}

async function submitEmail(){
  const btn=document.getElementById('g'), err=document.getElementById('emailErr');
  const email=(A.email||'').trim().toLowerCase();
  if(!/.+@.+\..+/.test(email)){ if(err){err.textContent='Please enter a valid email address.'; err.style.display='block';} return; }
  A.email=email; if(err) err.style.display='none';
  btn.dataset.label=btn.dataset.label||btn.textContent; btn.disabled=true; btn.textContent='Sending…';
  try{
    const resp=await saveData(buildPayload());
    fireQuizLead(resp && resp.external_id);   // Lead только после 200 OK
    next();
  }catch(e){
    if(e && e.error_code==='invalid_email'){ if(err){err.textContent=e.error_message||'Please enter a valid email address.'; err.style.display='block';} }
    else if(e && e.error_message){ if(err){err.textContent=e.error_message; err.style.display='block';} }
    else if(DEV_BYPASS){ console.warn('save-data unreachable — DEV_BYPASS on, advancing.', e); next(); return; }
    else if(err){ err.textContent='Something went wrong. Please try again.'; err.style.display='block'; }
    btn.disabled=false; btn.textContent=btn.dataset.label||'Continue';
  }
}
// ==================== /BACKEND INTEGRATION ====================

// ---------- engine ----------
function paint(){
  const scr=S[step];
  document.getElementById('stage').innerHTML=scr.render();
  const total=S.length-1, pctv=Math.round((step/total)*100);
  const hero=!!scr.hero;
  document.getElementById('progbar').style.width=(hero?0:pctv)+"%";
  document.getElementById('pct').textContent=(hero?0:pctv)+"%";
  document.getElementById('back').style.visibility=step>0?"visible":"hidden";
  document.getElementById('frame').classList.toggle('hero',hero);
  if(scr.onShow)scr.onShow();
}
function next(){const s=S[step];if(s.onLeave)s.onLeave();if(step<S.length-1){step++;paint();}}
function prev(){const s=S[step];if(s.onLeave)s.onLeave();if(step>0){step--;paint();}}
paint();

// register-lead — на первом действии пользователя или по таймауту 3.5с (не конкурирует с рендером)
['click','scroll','touchstart','keydown'].forEach(function(ev){ window.addEventListener(ev, registerLead, { once:true, passive:true }); });
setTimeout(registerLead, 3500);
</script>
