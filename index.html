<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Intch · Growth Funnel v2</title>
<style>
  :root{
    --bg:#000000; --bg2:#0A0A0A; --card:#0F0F10; --card2:#161719; --ink:#FFFFFF; --muted:#9AA0A6;
    --accent:#5C9CE0; --sky1:#9CC6EE; --sky2:#5C9CE0; --good:#3BE8B0;
    --line:rgba(255,255,255,.12); --shadow:0 24px 70px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);min-height:100%;
    display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:560px}
  .frame{background:var(--bg2);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:background .4s ease}
  .frame.hero{background:linear-gradient(165deg,var(--sky1) 0%,var(--sky2) 100%);border-color:transparent}
  .frame.hero .topbar{border-bottom-color:rgba(255,255,255,.25)}
  .frame.hero .prog{background:rgba(255,255,255,.3)}
  .frame.hero .kicker{color:#0A0A0A}
  .frame.hero .btn{background:#0A0A0A;color:#fff}
  .frame.hero p.sub{color:rgba(0,0,0,.72)}
  .frame.hero .opt{background:rgba(255,255,255,.65);border-color:rgba(255,255,255,.7);color:#0A0A0A}
  .frame.hero .opt:hover{background:rgba(255,255,255,.85)}
  .frame.hero .opt.sel{background:#0A0A0A;color:#fff;border-color:#0A0A0A}
  .frame.hero .opt.sel .tick{background:#fff;border-color:#fff;color:#0A0A0A}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;letter-spacing:.3px;font-size:15px}
  .logo span{color:var(--accent)}
  .prog{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pct{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
  .stage{padding:32px 26px 26px}
  .kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .kicker.soft{color:var(--muted)}
  h1{font-size:30px;line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
  h2{font-size:25px;line-height:1.15;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  h2.center,h1.center{text-align:center}
  p.sub{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
  p.sub.center{text-align:center}
  .opts{display:flex;flex-direction:column;gap:11px;margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:13px;padding:17px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card2);cursor:pointer;transition:.16s;font-size:15px;line-height:1.35;font-weight:500}
  .opt:hover{border-color:rgba(255,255,255,.28);background:#20242a}
  .opt.sel{border-color:var(--accent);background:rgba(92,156,224,.16);box-shadow:0 0 0 1px var(--accent) inset}
  .opt .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;color:transparent}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt .emoji{font-size:20px}
  .scale{display:flex;gap:12px;margin:6px 0 4px}
  .scard{flex:1;padding:26px 0;border:1px solid var(--line);border-radius:18px;background:var(--card2);cursor:pointer;font-size:32px;text-align:center;transition:.16s}
  .scard:hover{border-color:rgba(255,255,255,.3);background:#20242a}
  .scard.sel{border-color:var(--accent);background:rgba(92,156,224,.16);box-shadow:0 0 0 1px var(--accent) inset}
  .bubble{background:rgba(92,156,224,.12);border:1px solid rgba(92,156,224,.32);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;margin-top:14px;color:#dbe9f8}
  input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:15px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{margin-top:20px;width:100%;padding:17px;border:none;border-radius:999px;cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.01em;background:#fff;color:#0D0E10;transition:.15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(255,255,255,.14)}
  .btn:disabled{opacity:.28;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:rgba(255,255,255,.05);box-shadow:none}
  .center-emoji{font-size:60px;text-align:center;margin:10px 0 18px}
  .badge{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--muted);margin-bottom:18px}
  .proof{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;text-align:center}
  .proof .q{font-size:16px;line-height:1.5;margin:6px 0 14px}
  .stars{display:flex;justify-content:center;gap:26px;margin-top:10px;color:var(--muted);font-size:12px}
  .stars b{display:block;color:var(--ink);font-size:20px;margin-top:2px}
  .loader{display:grid;place-items:center;padding:14px 0 6px}
  .ring{width:60px;height:60px;border-radius:99px;border:5px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .checks{margin:20px 0 4px;display:flex;flex-direction:column;gap:12px}
  .crow{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--muted);transition:.3s}
  .crow.done{color:var(--good)}
  .crow.active{color:var(--ink)}
  .cbox{width:22px;height:22px;border-radius:99px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:12px}
  .crow.done .cbox{background:var(--good);border-color:var(--good);color:#04170f}
  .rev-num{display:inline-block;background:var(--good);color:#04170f;font-weight:800;padding:2px 12px;border-radius:10px}
  .card2{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .card2 h4{margin:0 0 8px;font-size:15px}
  .card2 p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  .mile{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;font-size:14px}
  .mile .ic{font-size:20px}
  /* growth chart hero */
  .growchart{margin:14px 0 8px}
  .growchart svg{width:100%;height:auto;display:block}
  .grow-line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.2s cubic-bezier(.4,0,.2,1) forwards .15s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .grow-dot{opacity:0;animation:pop .3s ease forwards}
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  /* timeline (personal plan) — carded */
  .timeline{margin:14px 0 6px;position:relative}
  .tl-row{position:relative;display:flex;gap:14px;padding:0 0 12px 0}
  .tl-row:last-child{padding-bottom:0}
  .tl-row::before{content:"";position:absolute;left:9px;top:28px;bottom:-4px;width:2px;background:rgba(255,255,255,.14)}
  .tl-row:last-child::before{display:none}
  .tl-dot{width:20px;height:20px;border-radius:99px;border:2px solid var(--accent);background:var(--bg2);flex:none;margin-top:15px;z-index:1}
  .tl-row.start .tl-dot{border-color:var(--muted)}
  .tl-row.goal .tl-dot{background:var(--good);border-color:var(--good);box-shadow:0 0 0 5px rgba(59,232,176,.18)}
  .tl-body{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
  .tl-row.goal .tl-body{border-color:rgba(59,232,176,.4);background:rgba(59,232,176,.08);box-shadow:0 0 26px rgba(59,232,176,.12)}
  .tl-when{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .tl-row.goal .tl-when{color:var(--good)}
  .tl-what{font-size:16px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .tl-row.goal .tl-what{color:var(--good)}
  /* pipeline (how Intch works) */
  .pipe{margin:20px 0 6px}
  .pl-row{position:relative;display:flex;gap:16px;padding:0 0 24px 0}
  .pl-row:last-child{padding-bottom:0}
  .pl-row::before{content:"";position:absolute;left:15px;top:34px;bottom:-2px;width:2px;background:rgba(255,255,255,.14)}
  .pl-row:last-child::before{display:none}
  .pl-dot{width:32px;height:32px;border-radius:99px;border:2px solid var(--line);background:var(--card2);flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);z-index:1}
  .pl-row.done .pl-dot{background:var(--good);border-color:var(--good);color:#04170f}
  .pl-row.next .pl-dot{border-color:var(--accent);color:var(--accent)}
  .pl-t{font-size:16px;font-weight:700}
  .pl-row.next .pl-t{color:var(--accent)}
  .pl-s{font-size:13px;color:var(--muted);margin-top:2px}
  /* booking screen (wow) */
  .expo{position:relative;display:grid;place-items:center;padding:16px 0 2px}
  .expo-glow{position:absolute;width:200px;height:130px;background:radial-gradient(circle,rgba(92,156,224,.4),transparent 68%);filter:blur(6px)}
  .avstack{position:relative;display:flex;justify-content:center}
  .avc{width:60px;height:60px;border-radius:99px;border:3px solid var(--bg2);display:grid;place-items:center;font-weight:800;font-size:21px;color:#04140f;margin-left:-16px;box-shadow:0 6px 20px rgba(0,0,0,.45);animation:pop .4s ease backwards}
  .avc:nth-child(1){margin-left:0;animation-delay:.05s}.avc:nth-child(2){animation-delay:.15s}.avc:nth-child(3){animation-delay:.25s}.avc:nth-child(4){animation-delay:.35s}
  .avc.more{background:var(--card2);color:var(--muted);font-size:22px}
  .matched-badge{display:inline-flex;gap:6px;align-items:center;background:rgba(59,232,176,.12);border:1px solid rgba(59,232,176,.35);color:var(--good);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;margin-top:8px}
  .pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600}
  .leftcard{text-align:left;margin-top:14px}
  .clist{display:flex;flex-direction:column;gap:11px}
  .ci{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.45}
  .ck{width:20px;height:20px;border-radius:99px;background:rgba(59,232,176,.15);color:var(--good);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
  .btn.glow{animation:btnglow 2.4s ease-in-out infinite}
  @keyframes btnglow{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 28px rgba(255,255,255,.3)}}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .backlink{color:var(--ink);cursor:pointer;font-size:22px;line-height:1;user-select:none;opacity:.85;padding-right:2px}
  .backlink:hover{opacity:1}
  .frame.hero .backlink{color:#0A0A0A}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .devnote{max-width:560px;margin:14px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.5}
  svg{display:block;width:100%}
</style>
</head>
<body>
<div class="app">
  <div class="frame" id="frame">
    <div class="topbar">
      <div class="backlink" id="back" onclick="prev()" style="visibility:hidden">←</div>
      <div class="logo">Intch<span>.</span></div>
      <div class="prog"><i id="progbar"></i></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
const A={};
let step=0;

// ---------- content maps ----------
const GOAL_AFF={
  sales:"Great goal. Owners who hit this usually don't need more hustle — they need the right system and the right people. Let's pinpoint yours.",
  marketing:"Smart focus. A steady flow of leads isn't luck — it's a system and the right person running it. Let's find yours.",
  pipeline:"That's the goal — revenue you can count on every month. It's a system, not luck. Let's map it.",
  markets:"Ambitious — and doable. New markets reward businesses with the right people on the ground. Let's see what you need."
};
const GOAL_LABEL={sales:"more sales",marketing:"a steady flow of leads",pipeline:"predictable revenue",markets:"new markets"};
const BN_EMP={
  leads:"We get it. \"Where do I find leads\" is the #1 thing owners tell us — many burn budget for months before it clicks. Last month alone we helped dozens of owners fix their lead flow.",
  close:"We hear this constantly. Leads come in, deals stall — and it quietly kills growth. The good news: it's the most fixable leak of all.",
  brand:"Being invisible is exhausting. Owners who break through don't shout louder — they get the right person to build presence. You're not alone here.",
  scale:"The \"everything depends on me\" trap catches almost every founder. It's not a you-problem — it's a missing-people problem. And it's solvable."
};
const BN_LABEL={leads:"finding leads",close:"closing deals",brand:"brand awareness",scale:"scaling beyond you"};
const REV_N={leads:2678,close:2413,brand:2156,scale:2089};
const VISION_OPTS=[
  {v:"x2rev",t:"2× revenue in the next 12 months"},
  {v:"systemic",t:"Systemic sales — get off word-of-mouth"},
  {v:"markets",t:"New markets (US / EU / MENA)"},
  {v:"stepout",t:"Step out of day-to-day operations"}];
const VISION_LABEL={x2rev:"2× revenue",systemic:"Systemic, predictable sales",markets:"Live in new markets",stepout:"Out of day-to-day ops"};
const BN_NOW={leads:"No steady flow of leads",close:"Deals stall and slip away",brand:"Invisible in your market",scale:"Growth bottlenecked on you"};
const FUTURE_LABEL={revenue:"Predictable monthly revenue",cycle:"A shorter sales cycle",close:"A higher close rate",margins:"Stronger margins",inbound:"Inbound leads coming in",selfrun:"Sales running without you"};

// ---------- helpers ----------
function q(kicker,title,sub,scr){
  const multi=!!scr.multi;
  const sel=A[scr.key];
  const isOn=(v)=> multi ? (Array.isArray(sel)&&sel.includes(v)) : sel===v;
  const opts=scr.choices.map(c=>{
    const handler=multi?`chooseMulti(this,'${scr.key}','${c.v}')`:`choose(this,'${scr.key}','${c.v}')`;
    return `<div class="opt ${isOn(c.v)?'sel':''}" onclick="${handler}"><div class="tick">✓</div>${c.e?`<div class="emoji">${c.e}</div>`:''}<div>${c.t}</div></div>`;
  }).join("");
  const enabled=multi?(Array.isArray(sel)&&sel.length>0):!!sel;
  return `<div class="fade"><div class="kicker">${kicker}</div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}
    <div class="opts">${opts}</div>
    <button class="btn" id="cont" onclick="next()" ${enabled?"":"disabled"}>Continue</button></div>`;
}
function scaleScreen(scr){
  const sel=A[scr.key];
  const cards=[["dislike","👎"],["neutral","🤷"],["like","👍"]].map(([v,e])=>
    `<div class="scard ${sel===v?'sel':''}" onclick="chooseScale(this,'${scr.key}','${v}')">${e}</div>`).join("");
  return `<div class="fade"><div class="kicker soft">${scr.kicker}</div><h2>${scr.statement}</h2>
    <div class="scale">${cards}</div>
    <div class="bubble" id="bub" style="display:${sel?'block':'none'}">${scr.affirm}</div>
    <button class="btn" id="cont" onclick="next()" ${sel?"":"disabled"}>Continue</button></div>`;
}
function choose(el,key,v){
  A[key]=v;
  const box=el.closest('.opts'); if(box) box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  const b=document.getElementById('cont'); if(b) b.disabled=false;
}
function chooseMulti(el,key,v){
  if(!Array.isArray(A[key])) A[key]=[];
  const i=A[key].indexOf(v);
  if(i>=0){A[key].splice(i,1);el.classList.remove('sel');}
  else{A[key].push(v);el.classList.add('sel');}
  const b=document.getElementById('cont'); if(b) b.disabled=A[key].length===0;
}
function chooseScale(el,key,v){
  A[key]=v;
  const box=el.closest('.scale'); if(box) box.querySelectorAll('.scard').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  const bub=document.getElementById('bub'); if(bub) bub.style.display='block';
  const b=document.getElementById('cont'); if(b) b.disabled=false;
}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function daysFromNow(n){const d=new Date();d.setDate(d.getDate()+n);return d;}

// ---------- SCREENS ----------
const S=[];

// 0 HOOK + goal (blue hero)
S.push({hero:true,render:()=>q("Growth Diagnostic",
  "What's your #1 goal right now?",
  "Every month without a system, you leave revenue on the table. Let's find where — in 2 minutes.",
  {key:"goal",choices:[
    {v:"sales",t:"Close more sales"},
    {v:"marketing",t:"Get a steady flow of leads"},
    {v:"pipeline",t:"Make revenue predictable"},
    {v:"markets",t:"Break into new markets"}]})});

// 1 affirmation (dynamic by goal)
S.push({render:()=>`<div class="fade" style="text-align:center">
  <div class="center-emoji">🙌</div>
  <h2 class="center">Love it — you're in the right place</h2>
  <p class="sub center">${GOAL_AFF[A.goal]||GOAL_AFF.sales}</p>
  <button class="btn" onclick="next()">Continue</button></div>`});

// 2 social proof
S.push({render:()=>`<div class="fade">
  <h2 class="center">Business owners in 140+ countries grow with Intch</h2>
  <div class="proof"><div style="color:var(--accent);font-size:24px">&rdquo;</div>
    <div class="q">Intch is <b>disrupting</b> how companies find the people who actually move revenue.</div>
    <div style="color:var(--muted);font-weight:700">yahoo!finance</div>
    <div class="stars"><span>APP STORE<b>★ 5.0</b></span><span>GOOGLE PLAY<b>★ 4.2</b></span></div>
  </div>
  <button class="btn" onclick="next()">Continue</button></div>`});

// 3 niche
S.push({key:"niche",choices:[
  {v:"saas",t:"SaaS / IT product"},{v:"agency",t:"Agency / services"},
  {v:"ecom",t:"E-commerce / retail"},{v:"prod",t:"Manufacturing / B2B supply"},
  {v:"edu",t:"Education / EdTech"},{v:"other",t:"Other"}],
  render(){return q("About your business","What does your business do?","So we can match relevant examples and experts from your space.",this)}});

// 4 revenue (scoring)
S.push({key:"revenue",choices:[
  {v:"lt10",t:"Under $10k / mo"},{v:"10-50",t:"$10k – $50k / mo"},
  {v:"50-150",t:"$50k – $150k / mo"},{v:"150+",t:"$150k+ / mo"}],
  render(){return q("Scale","What's your current monthly revenue?","To benchmark you against similar businesses. We don't store exact numbers.",this)}});

// 5 bottleneck
S.push({key:"bottleneck",choices:[
  {v:"leads",t:"I don't know where to find leads"},
  {v:"close",t:"Leads come in, but I can't close them well"},
  {v:"brand",t:"Nobody knows my brand — I want a name"},
  {v:"scale",t:"Everything depends on me — it doesn't scale"}],
  render(){return q("The real problem","Where's your biggest growth bottleneck right now?","The one that hurts most.",this)}});

// 6 empathy + social proof (dynamic)
S.push({render:()=>`<div class="fade" style="text-align:center">
  <div class="center-emoji">🤝</div>
  <h2 class="center">You're not alone in this</h2>
  <p class="sub center">${BN_EMP[A.bottleneck]||BN_EMP.leads}</p>
  <button class="btn" onclick="next()">Continue</button></div>`});

// 6b bright future (Idea C) — multi
S.push({key:"future",multi:true,choices:[
  {v:"revenue",t:"Predictable monthly revenue"},
  {v:"cycle",t:"A shorter sales cycle"},
  {v:"close",t:"A higher close rate"},
  {v:"margins",t:"Stronger margins"},
  {v:"inbound",t:"Inbound leads coming to me"},
  {v:"selfrun",t:"A team that sells without me"}],
  render(){return q("What great looks like","When your sales engine finally works — what do you want it to look like?","Pick all that apply.",this)}});

// 8 scale 2
S.push({key:"scale2",kicker:"How much does this fit you?",
  statement:"I'd rather hire someone who's already solved this in my niche",
  affirm:"Exactly how Intch works — we match you with people who've solved this exact problem in businesses like yours.",
  render(){return scaleScreen(this)}});

// 9 role (scoring)
S.push({key:"role",choices:[
  {v:"founder",t:"Founder / CEO / co-owner"},{v:"clevel",t:"C-level / department director"},
  {v:"head",t:"Head of a team"},{v:"employee",t:"Employee / just exploring"}],
  render(){return q("You","What's your role?","So we know who we're talking to.",this)}});

// 10 team (scoring)
S.push({key:"team",choices:[
  {v:"1-5",t:"1–5 people"},{v:"6-20",t:"6–20 people"},{v:"21-50",t:"21–50 people"},
  {v:"51-150",t:"51–150 people"},{v:"150+",t:"150+ people"}],
  render(){return q("Team","How big is your team?","Team size hints where growth usually gets stuck.",this)}});

// 11 urgency (scoring)
S.push({key:"urgency",choices:[

// ---------- scoring ----------
function leadScore(){
  const R={lt10:0,'10-50':15,'50-150':25,'150+':35}[A.revenue]||0;
  const T={'1-5':3,'6-20':8,'21-50':15,'51-150':20,'150+':20}[A.team]||0;
  const RO={founder:20,clevel:14,head:8,employee:0}[A.role]||0;
  const U={now:25,quarter:16,year:8,explore:0}[A.urgency]||0;
  return R+T+RO+U; // max 100 (no calculator in this funnel)
}
function leadSegment(){
  const p=leadScore();
  let seg = p>=60 ? 'A' : p>=35 ? 'B' : 'V';
  if(A.urgency==='now' && A.role==='founder' && p>=45) seg='A';
  if(A.role==='employee') seg='V';
  if(A.urgency==='explore' && p<45) seg='V';
  A.leadScore=p; A.leadSegment=seg;
  console.log('LEAD',{score:p,seg,goal:A.goal,bottleneck:A.bottleneck});
  return seg;
}
function finalScreen(){
  leadSegment(); // всё ещё считаем и логируем score/segment для будущей аналитики — но UI ведём всех на звонок
  return `<div class="fade" style="text-align:center">
    <div class="expo">
      <div class="expo-glow"></div>
      <div class="avstack">
        <div class="avc" style="background:linear-gradient(135deg,#5C9CE0,#3BE8B0)">A</div>

        <div class="avc" style="background:linear-gradient(135deg,#3BE8B0,#5C9CE0)">R</div>
        <div class="avc more">+</div>
      </div>
    </div>
    <div class="matched-badge">✓ Matched to your business</div>
    <h2 class="center" style="margin-top:12px">Your experts are ready to meet you</h2>
    <p class="sub center">Book a free strategy call — we'll turn your diagnosis into a real plan.</p>
    <div class="pills"><span class="pill">Free</span><span class="pill">45 minutes</span><span class="pill">No obligation</span></div>
    <div class="card2 leftcard"><h4>What happens on the call</h4>
      <div class="clist">
        <div class="ci"><span class="ck">✓</span>We complete your growth picture — where you are vs where you want to be</div>
        <div class="ci"><span class="ck">✓</span>We show you exactly how we'd solve it</div>
        <div class="ci"><span class="ck">✓</span>You leave with a tailored plan and the 2–3 experts who fit</div>
      </div>
    </div>
    <button class="btn glow" onclick="cta('call')">Book my free strategy call</button></div>`;
}
function cta(kind){
  A.cta_clicked=kind;console.log('CTA',kind,'segment',A.leadSegment);
  if(kind==='call'){window.open('https://calendly.com/gregory-z-intch/intch-demo-call','_blank');return;}
  alert("→ Intch platform: browse matched vetted experts.");
}
function gate(){
  const ok=(A.name||'').trim().length>1 && /.+@.+\..+/.test(A.email||'');
  const g=document.getElementById('g');if(g)g.disabled=!ok;
}

// ---------- engine ----------
function paint(){
  const scr=S[step];
  document.getElementById('stage').innerHTML=scr.render();
  const total=S.length-1, pctv=Math.round((step/total)*100);
  const hero=!!scr.hero;
  document.getElementById('progbar').style.width=(hero?0:pctv)+"%";
  document.getElementById('pct').textContent=(hero?0:pctv)+"%";
  document.getElementById('back').style.visibility=step>0?"visible":"hidden";
  document.getElementById('frame').classList.toggle('hero',hero);
  if(scr.onShow)scr.onShow();
}
function next(){const s=S[step];if(s.onLeave)s.onLeave();if(step<S.length-1){step++;paint();}}
function prev(){const s=S[step];if(s.onLeave)s.onLeave();if(step>0){step--;paint();}}
paint();
</script>
